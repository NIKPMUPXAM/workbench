<script>
(function () {
    var KEY = 'wb_worklog';
    var list = document.getElementById('logList');
    var dateI = document.getElementById('logDate');
    var contentI = document.getElementById('logContent');
    var calEl = document.getElementById('logCalendar');
    if (dateI && !dateI.value) dateI.value = new Date().toISOString().slice(0, 10);

    function get() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
    function save(arr) { try { localStorage.setItem(KEY, JSON.stringify(arr)); var _ov = JSON.parse(localStorage.getItem('wb_overview') || '{}'); _ov.logCount = arr.length; _ov.updatedAt = new Date().toISOString(); localStorage.setItem('wb_overview', JSON.stringify(_ov)); } catch (e) {} }
    function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // 按日期查找索引
    function findByDate(dateStr) {
        var d = get();
        for (var i = 0; i < d.length; i++) { if (d[i].date === dateStr) return i; }
        return -1;
    }

    // 渲染日志列表（支持按周 / 月 / 年筛选）
    var curLogFilter = 'all';
    function inLogRange(ds) {
        if (curLogFilter === 'all' || !ds) return true;
        var d = new Date(ds + 'T00:00:00');
        if (isNaN(d)) return true;
        var now = new Date();
        if (curLogFilter === 'year') return d.getFullYear() === now.getFullYear();
        if (curLogFilter === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        if (curLogFilter === 'week') {
            var day = (now.getDay() + 6) % 7; // 周一为0
            var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
            monday.setHours(0, 0, 0, 0);
            var sunday = new Date(monday); sunday.setDate(monday.getDate() + 7);
            return d >= monday && d < sunday;
        }
        return true;
    }
    function render() {
        var d = get();
        if (!d.length) {
            list.innerHTML = '<div class="empty-state"><div class="icon">📝</div><div>暂无日志，开始记录吧</div></div>';
        } else {
            var html = '';
            d.forEach(function (it, idx) {
                if (!inLogRange(it.date)) return;
                html += '<div class="log-item"><div class="log-meta"><span>📅 ' + esc(it.date) + '</span><button class="log-del" data-i="' + idx + '">删除</button></div><div class="log-text">' + esc(it.text) + '</div></div>';
            });
            list.innerHTML = html || '<div class="empty-state"><div class="icon">📝</div><div>该范围内暂无日志</div></div>';
        }
        list.querySelectorAll('.log-del').forEach(function (b) {
            b.addEventListener('click', function () {
                if (!confirm('确定删除该工作日志？此操作不可撤销。')) return;
                var arr = get(); arr.splice(+b.getAttribute('data-i'), 1);
                save(arr); render(); renderCalendar();
            });
        });
    }

    // 渲染日历（高亮有日志的日期，支持月份翻页）
    var MONTHS = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    var _now = new Date();
    var viewY = _now.getFullYear(), viewM = _now.getMonth();
    var calPrev = document.getElementById('logCalPrev');
    var calNext = document.getElementById('logCalNext');
    var calLabel = document.getElementById('logCalLabel');

    function renderCalendar() {
        if (!calEl) return;
        var d = get();
        var datesWithLogs = {};
        d.forEach(function (it) { datesWithLogs[it.date] = true; });

        var y = viewY, m = viewM;
        var firstDay = new Date(y, m, 1).getDay(); // 0=周日
        var daysInMonth = new Date(y, m + 1, 0).getDate();
        var adjFirst = firstDay === 0 ? 6 : firstDay - 1; // 周一起
        var isCurMonth = (y === _now.getFullYear() && m === _now.getMonth());

        if (calLabel) calLabel.textContent = y + '年 ' + MONTHS[m];

        var html = '<div class="cal-row">';
        ['一', '二', '三', '四', '五', '六', '日'].forEach(function (dn) {
            html += '<div class="cal-cell cal-head">' + dn + '</div>';
        });
        html += '</div><div class="cal-row">';
        for (var i = 0; i < adjFirst; i++) html += '<div class="cal-cell cal-empty"></div>';
        for (var day = 1; day <= daysInMonth; day++) {
            var ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            var hasLog = datesWithLogs[ds];
            var isToday = isCurMonth && (day === _now.getDate());
            var cls = 'cal-cell' + (hasLog ? ' cal-has-log' : '') + (isToday ? ' cal-today' : '');
            html += '<div class="' + cls + '" data-date="' + ds + '">' + day + '</div>';
            if ((adjFirst + day) % 7 === 0 && day < daysInMonth) html += '</div><div class="cal-row">';
        }
        html += '</div>';
        calEl.innerHTML = html;

        // 点击日历加载对应日志
        calEl.querySelectorAll('.cal-cell[data-date]').forEach(function (cell) {
            cell.addEventListener('click', function () {
                var dt = cell.getAttribute('data-date');
                dateI.value = dt;
                var idx = findByDate(dt);
                contentI.value = idx >= 0 ? get()[idx].text : '';
                contentI.focus();
            });
        });
    }

    if (calPrev) calPrev.addEventListener('click', function () {
        viewM--; if (viewM < 0) { viewM = 11; viewY--; }
        renderCalendar();
    });
    if (calNext) calNext.addEventListener('click', function () {
        viewM++; if (viewM > 11) { viewM = 0; viewY++; }
        renderCalendar();
    });

    // 保存：覆盖当日
    var saveBtn = document.getElementById('logSave');
    if (saveBtn) saveBtn.addEventListener('click', function () {
        var t = contentI.value.trim();
        if (!t) { alert('请输入日志内容'); return; }
        var dt = dateI.value || new Date().toISOString().slice(0, 10);
        var arr = get();
        var idx = findByDate(dt);
        if (idx >= 0) {
            arr[idx].text = t; // 覆盖
        } else {
            arr.unshift({ date: dt, text: t }); // 新增
        }
        save(arr);
        render(); renderCalendar();
        contentI.value = '';
    });

    // 周 / 月 / 年 筛选
    var lf = document.querySelector('.filter-bar');
    if (lf) {
        lf.querySelectorAll('.filter-btn').forEach(function (b) {
            b.addEventListener('click', function () {
                lf.querySelectorAll('.filter-btn').forEach(function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                curLogFilter = b.getAttribute('data-range');
                render();
            });
        });
    }

    render();
    renderCalendar();
})();
</script>

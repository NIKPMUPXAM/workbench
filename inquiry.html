<script src="assets/app.js?v=s1"></script>
<script>
(function () {
    var table = document.getElementById('inquiryTable');
    var body = table ? table.querySelector('tbody') : null;
    var curSource = '';
    var curRange = 'all';

    var SRC_NAMES = {
        tiktok: '🎵 TikTok', instagram: '📷 Instagram', facebook: '👤 Facebook',
        youtube: '▶️ YouTube', twitter: '🐦 推特 X', douyin: '🎵 抖音',
        mic: '🏭 制造网', other: '📌 其他'
    };
    var SOURCES_ORDER = ['tiktok','instagram','facebook','youtube','twitter','douyin','mic','other'];

    // 日期是否在指定范围内
    function inRange(ds) {
        if (curRange === 'all' || !ds) return true;
        var d = new Date(ds + 'T00:00:00');
        if (isNaN(d)) return true;
        var now = new Date();
        if (curRange === 'year') return d.getFullYear() === now.getFullYear();
        if (curRange === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        if (curRange === 'quarter') {
            var q = Math.floor(now.getMonth() / 3), qd = Math.floor(d.getMonth() / 3);
            return d.getFullYear() === now.getFullYear() && q === qd;
        }
        if (curRange === 'week') {
            var day = (now.getDay() + 6) % 7; // 周一为0
            var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
            monday.setHours(0, 0, 0, 0);
            var sunday = new Date(monday); sunday.setDate(monday.getDate() + 7);
            return d >= monday && d < sunday;
        }
        return true;
    }

    function rowSource(tr) {
        var sel = tr.children[1] ? tr.children[1].querySelector('select') : null;
        return sel ? sel.value : '';
    }
    function rowDate(tr) {
        var inp = tr.children[0] ? tr.children[0].querySelector('input') : null;
        return inp ? inp.value : '';
    }
    function rowHasData(tr) {
        for (var i = 0; i < tr.children.length; i++) {
            var inp = tr.children[i].querySelector('input');
            var sel = tr.children[i].querySelector('select');
            if (inp && inp.value.trim()) return true;
            if (sel && sel.value) return true;
        }
        return false;
    }

    // 统计 + 分布 + 过滤
    function refresh() {
        if (!body) return;
        var rows = body.querySelectorAll('tr');
        var total = 0, matched = 0;
        var sourceCount = {};
        rows.forEach(function (tr) {
            if (!rowHasData(tr)) { tr.style.display = 'none'; return; }
            total++;
            var src = rowSource(tr);
            if (src) sourceCount[src] = (sourceCount[src] || 0) + 1;
            var ok = inRange(rowDate(tr)) && (!curSource || src === curSource);
            tr.style.display = ok ? '' : 'none';
            if (ok) matched++;
        });

        var g = function (id) { return document.getElementById(id); };
        if (g('statTotal')) g('statTotal').textContent = total;
        if (g('statRate')) g('statRate').innerHTML = Math.min(100, Math.round(total / 5 * 100)) + '<small>%</small>';

        // 来源分布 chips（展示全部来源，点击即筛选）
        var ssEl = document.getElementById('sourceStats');
        var nsEl = document.getElementById('noStatsHint');
        var clearBtn = document.getElementById('sourceClear');
        var resultEl = document.getElementById('sourceResult');
        if (ssEl && nsEl) {
            var keys = Object.keys(sourceCount);
            if (keys.length === 0) {
                ssEl.innerHTML = ''; nsEl.style.display = '';
            } else {
                nsEl.style.display = 'none';
                ssEl.innerHTML = SOURCES_ORDER.map(function (k) {
                    var c = sourceCount[k] || 0;
                    var cls = 'source-chip' + (curSource === k ? ' active' : '') + (c === 0 ? ' empty' : '');
                    return '<button type="button" class="' + cls + '" data-src="' + k + '">' +
                        (SRC_NAMES[k] || k) + ' <span class="cnt">' + c + '</span></button>';
                }).join('');
            }
            if (clearBtn) clearBtn.classList.toggle('show', !!curSource);
            if (resultEl) {
                if (curSource) {
                    resultEl.innerHTML = '正在按 <b>' + (SRC_NAMES[curSource] || curSource) + '</b> 筛选 · 显示 ' + matched + ' / ' + total + ' 条';
                    resultEl.style.display = '';
                } else {
                    resultEl.style.display = 'none';
                }
            }
        }
    }

    // 过滤按钮（时间）
    var fbar = document.querySelector('.filter-bar');
    if (fbar) {
        fbar.querySelectorAll('.filter-btn').forEach(function (b) {
            b.addEventListener('click', function () {
                fbar.querySelectorAll('.filter-btn').forEach(function (x) { x.classList.remove('active'); });
                b.classList.add('active');
                curRange = b.getAttribute('data-range');
                refresh();
            });
        });
        var srcSel = document.getElementById('filterSource');
        if (srcSel) srcSel.addEventListener('change', function () { curSource = srcSel.value; refresh(); });
    }

    // 来源分布 chips 点击 → 设置来源筛选
    var ssEl = document.getElementById('sourceStats');
    if (ssEl) ssEl.addEventListener('click', function (e) {
        var chip = e.target.closest('.source-chip');
        if (!chip) return;
        var k = chip.getAttribute('data-src');
        curSource = (curSource === k) ? '' : k; // 再点取消
        var srcSel = document.getElementById('filterSource');
        if (srcSel) srcSel.value = curSource;
        refresh();
    });

    // 清除来源筛选
    var clearBtn = document.getElementById('sourceClear');
    if (clearBtn) clearBtn.addEventListener('click', function () {
        curSource = '';
        var srcSel = document.getElementById('filterSource');
        if (srcSel) srcSel.value = '';
        refresh();
    });

    if (body) {
        body.addEventListener('input', refresh);
        body.addEventListener('change', refresh);
        if (window.MutationObserver) { new MutationObserver(refresh).observe(body, { childList: true, subtree: true }); }
        refresh();
    }
})();
</script>

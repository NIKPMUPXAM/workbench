<div class="content">

                <div class="ph-sub">丁楠 · 市场部营销端OKR（2026）完成度总览</div>
            </div>
        </div>
        <div class="ph-date">
            <div class="d-main" id="boardUpdated">实时数据</div>
            <div id="boardCount">--</div>
        </div>
    </div>

    <div class="board-docbar">
        <span class="bd-dot"></span>
        <span>数据实时拉取自企业微信共享文档：</span>
        <a id="boardDocLink" href="#" target="_blank" rel="noopener">市场部营销端OKR（2026）</a>
        <span class="bd-tip">（点右上角「刷新」可重新读取最新填写）</span>
    </div>

    <!-- 月份筛选 -->
    <div class="section-label">按月份筛选</div>
    <div class="board-filters" id="boardFilters"></div>

    <!-- 概览统计 -->
    <div class="board-summary" id="boardSummary"></div>

    <!-- 数据卡片 -->
    <div class="board-grid" id="boardGrid"></div>

    <div class="footer">
        <p>月工作数据看板 · 数据由企业微信共享文档「市场部营销端OKR（2026）」实时解析生成</p>
        <p style="margin-top:4px;">目标数 / 完成数 为文档中明确可量化的指标；标注「—」的为定性任务，进度按文档填写的完成度说明显示</p>
    </div>

<script src="assets/app.js?v=s9"></script>
<script>
(function () {
    var board = window.WB_OKR_BOARD;
    if (!board) {
        document.getElementById('boardGrid').innerHTML =
            '<div class="empty-state" style="padding:40px;"><div class="icon">⚠️</div><div>看板数据未加载，请刷新或检查网络</div></div>';
        return;
    }
    var docUrl = board.doc_url || '#';
    var docLink = document.getElementById('boardDocLink');
    docLink.href = docUrl;
    var upd = document.getElementById('boardUpdated');
    if (board.updated) upd.textContent = '更新于 ' + board.updated;
    else upd.textContent = '数据来自企微文档';

    var months = board.months || [];
    var ratings = board.ratings || {};
    var data = board.data || {};
    var allItems = [];
    months.forEach(function (m) { (data[m] || []).forEach(function (it) { allItems.push(it); }); });
    document.getElementById('boardCount').textContent = '共 ' + allItems.length + ' 项指标';

    // 默认显示「当月」内容（若当月暂无数据则回退到最新月份）
    var now = new Date();
    var curKey = (now.getMonth() + 1) + '月';
    var defaultMonth = months.indexOf(curKey) >= 0 ? curKey
        : (months.length ? months[months.length - 1] : 'all');

    // 渲染筛选条
    var filters = document.getElementById('boardFilters');
    var fAll = mkFilter('全部', 'all', defaultMonth === 'all');
    filters.appendChild(fAll);
    months.forEach(function (m) {
        var r = ratings[m] ? ' · ' + ratings[m] : '';
        var isCur = (m === curKey);
        filters.appendChild(mkFilter(m + r + (isCur ? ' · 当月' : ''), m, m === defaultMonth));
    });
    function mkFilter(label, val, active) {
        var b = document.createElement('button');
        b.className = 'board-filter' + (active ? ' active' : '');
        b.textContent = label;
        b.dataset.val = val;
        b.onclick = function () {
            document.querySelectorAll('.board-filter').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            render(val);
        };
        return b;
    }

    function pctColor(p) {
        if (p === null || p === undefined) return '#9aa4b2';
        if (p >= 80) return '#2fae66';
        if (p >= 50) return '#3b82f6';
        if (p >= 30) return '#e8953a';
        return '#e2554f';
    }

    function render(filter) {
        var items = filter === 'all' ? allItems.slice() : (data[filter] || []);
        // 概览
        var sumBox = document.getElementById('boardSummary');
        var nums = items.filter(function (i) { return i.showNums; });
        var pcts = items.map(function (i) { return i.pct; }).filter(function (p) { return p !== null && p !== undefined; });
        var avg = pcts.length ? Math.round(pcts.reduce(function (a, b) { return a + b; }, 0) / pcts.length) : null;
        var rated = ratings[filter] || (filter === 'all' ? null : ratings[months[0]]);
        sumBox.innerHTML =
            '<div class="bs-card"><div class="bs-label">📋 指标数</div><div class="bs-val">' + items.length + '</div></div>' +
            '<div class="bs-card"><div class="bs-label">✅ 可量化项</div><div class="bs-val">' + nums.length + '</div></div>' +
            '<div class="bs-card"><div class="bs-label">📊 平均完成度</div><div class="bs-val">' + (avg === null ? '—' : avg + '%') + '</div></div>' +
            (rated ? '<div class="bs-card"><div class="bs-label">🏅 月度定级</div><div class="bs-val">' + rated + '</div></div>' : '');

        // 卡片
        var grid = document.getElementById('boardGrid');
        if (!items.length) {
            grid.innerHTML = '<div class="empty-state" style="padding:40px;"><div class="icon">🗓️</div><div>该月份暂无数据</div></div>';
            return;
        }
        grid.innerHTML = items.map(function (it) {
            var name = (it.name || '').replace(/</g, '&lt;');
            var note = (it.note || '').replace(/</g, '&lt;');
            var pct = it.pct;
            var pctTxt = (pct === null || pct === undefined) ? '—' : pct + '%';
            var barW = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
            var color = pctColor(pct);
            var tgt = it.showNums ? (it.targetNum + (it.targetUnit || '')) : '—';
            var dn = it.showNums ? (it.doneNum + (it.doneUnit || '')) : '—';
            var metric = it.metric || it.month || '';
            return '' +
                '<div class="board-card">' +
                    '<div class="bc-top"><span class="bc-tag">' + metric + '</span><span class="bc-month">' + it.month + '</span></div>' +
                    '<div class="bc-name">' + name + '</div>' +
                    '<div class="bc-nums">' +
                        '<div class="bc-num"><div class="bcn-label">目标数</div><div class="bcn-val">' + tgt + '</div></div>' +
                        '<div class="bc-num"><div class="bcn-label">完成数</div><div class="bcn-val">' + dn + '</div></div>' +
                        '<div class="bc-num"><div class="bcn-label">百分比</div><div class="bcn-val" style="color:' + color + '">' + pctTxt + '</div></div>' +
                    '</div>' +
                    '<div class="bc-bar"><div class="bc-bar-fill" style="width:' + barW + '%;background:' + color + '"></div></div>' +
                    (note ? '<div class="bc-note">📝 ' + note + '</div>' : '') +
                '</div>';
        }).join('');
    }
    render(defaultMonth);
})();
</script>

<div class="content">
    <div class="page-header">
        <div class="ph-left">
            <div class="ph-icon">📈</div>
            <div>
                <h1>月工作数据看板</h1>
                <div class="ph-sub">丁楠 · 市场部营销端OKR（2026）完成度总览</div>
            </div>
        </div>
        <div class="ph-date">
            <div class="d-main" id="boardUpdated">实时数据</div>
            <div id="boardCount">--</div>
        </div>
    </div>

    <div class="board-docbar">
        <span class="bd-dot"></span>
        <span>数据实时拉取自企业微信共享文档：</span>
        <a id="boardDocLink" href="#" target="_blank" rel="noopener">市场部营销端OKR（2026）</a>
        <span class="bd-tip">（点右上角「刷新」可重新读取最新填写）</span>
    </div>

    <!-- 月份筛选 -->
    <div class="section-label">按月份筛选</div>
    <div class="board-filters" id="boardFilters"></div>

    <!-- 概览统计（与「OKR 工作计划」同款） -->
    <div class="overview-metrics" id="boardSummary" style="margin-bottom:18px;"></div>

    <!-- 月份容器（OKR 同款排版：月份 → 指标分组 → 任务行 → 月度总结） -->
    <div id="okrRoot"></div>

    <div class="footer">
        <p>月工作数据看板 · 数据由企业微信共享文档「市场部营销端OKR（2026）」实时解析生成</p>
        <p style="margin-top:4px;">目标数 / 完成数 为文档中明确可量化的指标；标注「—」的为定性任务，进度按文档填写的完成度说明显示</p>
    </div>
</div>
</div>
<script src="assets/app.js?v=s10"></script>
<script>
(function () {
    var board = window.WB_OKR_BOARD;
    if (!board) {
        var warnEl = document.getElementById('okrRoot');
        if (warnEl) warnEl.innerHTML =
            '<div class="empty-state" style="padding:40px;"><div class="icon">⚠️</div><div>看板数据未加载，请刷新或检查网络</div></div>';
        return;
    }
    var docUrl = board.doc_url || '#';
    var docLink = document.getElementById('boardDocLink');
    docLink.href = docUrl;
    var upd = document.getElementById('boardUpdated');
    if (board.updated) upd.textContent = '更新于 ' + board.updated;
    else upd.textContent = '数据来自企微文档';

    var months = board.months || [];
    var ratings = board.ratings || {};
    var data = board.data || {};
    var summaries = board.summaries || {};
    var allItems = [];
    months.slice().reverse().forEach(function (m) { (data[m] || []).forEach(function (it) { allItems.push(it); }); });
    document.getElementById('boardCount').textContent = '共 ' + allItems.length + ' 项指标';

    // 默认显示「当月」内容（若当月暂无数据则回退到最新月份）
    var now = new Date();
    var curKey = (now.getMonth() + 1) + '月';
    var defaultMonth = months.indexOf(curKey) >= 0 ? curKey
        : (months.length ? months[months.length - 1] : 'all');

    // 渲染筛选条
    var filters = document.getElementById('boardFilters');
    var fAll = mkFilter('全部', 'all', defaultMonth === 'all');
    filters.appendChild(fAll);
    months.slice().reverse().forEach(function (m) {
        var r = ratings[m] ? ' · ' + ratings[m] : '';
        var isCur = (m === curKey);
        filters.appendChild(mkFilter(m + r + (isCur ? ' · 当月' : ''), m, m === defaultMonth));
    });
    function mkFilter(label, val, active) {
        var b = document.createElement('button');
        b.className = 'board-filter' + (active ? ' active' : '');
        b.textContent = label;
        b.dataset.val = val;
        b.onclick = function () {
            document.querySelectorAll('.board-filter').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            render(val);
        };
        return b;
    }

    function pctColor(p) {
        if (p === null || p === undefined) return '#9aa4b2';
        if (p >= 80) return '#2fae66';
        if (p >= 50) return '#3b82f6';
        if (p >= 30) return '#e8953a';
        return '#e2554f';
    }

    function avgPct(list) {
        var pcts = list.map(function (i) { return i.pct; }).filter(function (p) { return p !== null && p !== undefined; });
        return pcts.length ? Math.round(pcts.reduce(function (a, b) { return a + b; }, 0) / pcts.length) : null;
    }
    function tgtOf(it) {
        var v = (it.targetNum != null) ? it.targetNum : (it.target && it.target[0] != null ? it.target[0] : null);
        var u = it.targetUnit || (it.target && it.target[1]) || '';
        return v != null ? (v + u) : '—';
    }
    function doneOf(it) {
        return it.showNums ? (it.doneNum + (it.doneUnit || '')) : '—';
    }
    function escHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 按指标分组
    function groupByMetric(items) {
        var groups = [], map = {};
        items.forEach(function (it) {
            var k = ((it.metric || '').trim()) || '其他';
            if (!map[k]) { map[k] = { name: k, items: [] }; groups.push(map[k]); }
            map[k].items.push(it);
        });
        return groups;
    }

    // 任务行：任务名 + 月底完成情况（同一格），右侧 目标/完成/完成度
    function rowHTML(it) {
        var pct = it.pct;
        var pctTxt = (pct === null || pct === undefined) ? '—' : pct + '%';
        var color = pctColor(pct);
        var w = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
        var note = escHtml((it.note || '').trim());
        return '<tr>' +
            '<td class="c-task">' +
                '<div class="bd-task">' + escHtml(it.name || '') + '</div>' +
                (note
                    ? '<div class="bd-note"><span class="bd-note-tag">月底完成情况</span>' + note + '</div>'
                    : '<div class="bd-note bd-note-empty">月底完成情况：—</div>') +
            '</td>' +
            '<td class="c-num">' + escHtml(tgtOf(it)) + '</td>' +
            '<td class="c-num">' + escHtml(doneOf(it)) + '</td>' +
            '<td class="c-pct">' +
                '<span class="bd-pct" style="color:' + color + '">' + pctTxt + '</span>' +
                '<div class="bd-bar"><i style="width:' + w + '%;background:' + color + '"></i></div>' +
            '</td>' +
        '</tr>';
    }

    function groupHTML(g) {
        return '<div class="bd-group">' +
            '<div class="bd-group-title"><span class="bd-gdot"></span>' + escHtml(g.name) +
            '<span class="bd-gcount">' + g.items.length + ' 项</span></div>' +
            '<table class="bd-table">' +
                '<thead><tr><th class="c-task">任务</th><th class="c-num">目标</th>' +
                '<th class="c-num">完成</th><th class="c-pct">完成度</th></tr></thead>' +
                '<tbody>' + g.items.map(rowHTML).join('') + '</tbody>' +
            '</table>' +
        '</div>';
    }

    // 抖音询单数据（来自「丁楠-矩阵抖音渠道」，按月汇总）
    var inq = window.WB_INQUIRY_SEED || null;
    function chips(obj) {
        return Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; })
            .map(function (k) { return '<span class="inq-chip">' + escHtml(k) + ' <b>' + obj[k] + '</b></span>'; })
            .join('');
    }
    function inquiryModule(m) {
        if (!inq || !inq.items) return '';
        var list = inq.items.filter(function (i) { return i.month === m; });
        if (!list.length) return '';
        var bySales = {}, byType = {};
        list.forEach(function (i) {
            var s = i.sales || '未分配'; bySales[s] = (bySales[s] || 0) + 1;
            var t = i.type || '未分类'; byType[t] = (byType[t] || 0) + 1;
        });
        return '<div class="module" style="margin-top:16px;">' +
            '<div class="module-header"><div class="module-title"><span class="icon">📨</span> ' + m + ' 抖音询单数据</div>' +
            '<span class="tag tag-blue">丁楠-矩阵抖音渠道</span></div>' +
            '<div class="module-body">' +
                '<div class="inq-total">📨 询单总数 <b>' + list.length + '</b> 条</div>' +
                '<div class="inq-row"><span class="inq-label">业务员分配</span>' + chips(bySales) + '</div>' +
                '<div class="inq-row"><span class="inq-label">询盘类型</span>' + chips(byType) + '</div>' +
            '</div></div>';
    }

    // 月度总结（来自文档）
    function summaryModule(m) {
        var s = summaries[m] || '';
        return '<div class="module" style="margin-top:16px;">' +
            '<div class="module-header"><div class="module-title"><span class="icon">📝</span> ' + m + ' 月度总结</div>' +
            '<span class="tag tag-blue">来自企微文档</span></div>' +
            '<div class="module-body"><div class="bcon-body">' +
            (s ? escHtml(s) : '<span class="bcon-empty">该月文档暂未填写总结内容（可在企微文档对应月份末尾补充）</span>') +
            '</div></div></div>';
    }

    function monthBlock(m, items, collapsed) {
        var a = avgPct(items);
        return '<div class="bd-month" data-m="' + m + '">' +
            '<div class="bd-month-head">' +
                '<button class="bd-toggle' + (collapsed ? ' collapsed' : '') + '" type="button" title="折叠/展开">' + (collapsed ? '▸' : '▾') + '</button>' +
                '<div class="bd-month-title">' + m + ' · OKR</div>' +
                '<div class="bd-month-stat">平均完成度 <b>' + (a === null ? '—' : a + '%') + '</b></div>' +
            '</div>' +
            '<div class="bd-month-body' + (collapsed ? ' collapsed' : '') + '">' +
                groupByMetric(items).map(groupHTML).join('') +
                inquiryModule(m) +
                summaryModule(m) +
            '</div>' +
        '</div>';
    }

    function bindToggle(root) {
        root.querySelectorAll('.bd-month-head').forEach(function (h) {
            h.addEventListener('click', function () {
                var block = h.closest('.bd-month');
                if (!block) return;
                var body = block.querySelector('.bd-month-body');
                var btn = block.querySelector('.bd-toggle');
                var collapsed = body.classList.toggle('collapsed');
                if (btn) { btn.classList.toggle('collapsed', collapsed); btn.textContent = collapsed ? '▸' : '▾'; }
            });
        });
    }

    function render(filter) {
        var items = filter === 'all' ? allItems.slice() : (data[filter] || []);
        var sumBox = document.getElementById('boardSummary');
        var nums = items.filter(function (i) { return i.showNums; });
        var avg = avgPct(items);
        var rated = ratings[filter] || (filter === 'all' ? null : ratings[filter]);
        if (sumBox) {
            sumBox.innerHTML =
                '<div class="mini-stat"><div class="ms-label">📋 指标数</div><div class="ms-value">' + items.length + '<small>项</small></div></div>' +
                '<div class="mini-stat success"><div class="ms-label">✅ 可量化</div><div class="ms-value">' + nums.length + '<small>项</small></div></div>' +
                '<div class="mini-stat warning"><div class="ms-label">📊 平均完成度</div><div class="ms-value">' + (avg === null ? '—' : avg + '<small>%</small>') + '</div></div>' +
                (rated ? '<div class="mini-stat"><div class="ms-label">🏅 月度定级</div><div class="ms-value">' + escHtml(rated) + '</div></div>' : '');
        }
        var root = document.getElementById('okrRoot');
        if (!root) return;
        if (!items.length) {
            root.innerHTML = '<div class="empty-state" style="padding:40px;"><div class="icon">🗓️</div><div>该月份暂无数据</div></div>';
            return;
        }
        if (filter === 'all') {
            root.innerHTML = months.slice().reverse().map(function (m) {
                return monthBlock(m, data[m] || [], m !== defaultMonth);
            }).join('');
        } else {
            root.innerHTML = monthBlock(filter, items, false);
        }
        bindToggle(root);
    }

    render(defaultMonth);
})();
</script>
</body>
